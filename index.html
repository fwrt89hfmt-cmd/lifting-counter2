<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A84FF"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리프팅"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><title>리프팅 기록</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding:18px 16px 30px;max-width:520px;margin:auto}
h1{font-size:25px;margin:8px 0 4px}.sub{color:#777;font-size:14px;margin-bottom:18px}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000f}
.progress-title{display:flex;justify-content:space-between;color:#666;font-size:14px}.progress-num{font-size:36px;font-weight:800;margin:8px 0}
.bar{height:12px;background:#e5e5ea;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#0A84FF;width:0%;transition:.2s}
.avg{display:flex;justify-content:space-between;margin-top:14px}.avg strong{font-size:22px}
label{display:block;color:#666;font-size:14px;margin-bottom:8px}
input{width:100%;font-size:30px;font-weight:700;text-align:center;border:1px solid #ddd;border-radius:14px;padding:12px;background:#fafafa}
button{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;width:100%;margin-top:10px}
.record{background:#0A84FF;color:white}.undo{background:#e5e5ea}.reset{background:#ff3b30;color:white}
.small{font-size:13px;color:#777;text-align:center;margin-top:10px}h2{font-size:18px;margin:2px 0 14px}
canvas{width:100%;height:210px;display:block}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.row:last-child{border:0}.complete{font-weight:700}.empty{text-align:center;color:#888;padding:25px 0}
</style></head><body>
<h1>⚽ 리프팅 기록</h1><div class="sub" id="dateText"></div>
<div class="card"><div class="progress-title"><span>오늘 누적</span><span>목표 500개</span></div>
<div class="progress-num"><span id="total">0</span><span style="font-size:20px;color:#888"> / 500</span></div>
<div class="bar"><div id="bar"></div></div><div class="avg"><span>현재 평균</span><strong id="avg">0.0개</strong></div></div>
<div class="card"><label for="count">이번 시도에서 성공한 리프팅 개수</label>
<input id="count" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
<button class="record" onclick="record()">기록하기</button><button class="undo" onclick="undo()">↩️ 실행 취소</button>
<div class="small">한 번의 시도가 끝날 때마다 개수를 입력하고 기록하세요.</div></div>
<div class="card"><h2>📈 하루 평균 성장세</h2><canvas id="chart"></canvas><div id="history"></div></div>
<div class="card"><button class="reset" onclick="resetAll()">🔄 오늘 기록 초기화</button>
<div class="small">기록은 이 기기에 자동 저장됩니다.</div></div>
<script>
const KEY="lifting-counter-v2";let data={days:{}};
const $=x=>document.getElementById(x);
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{let x=localStorage.getItem(KEY);if(x)data=JSON.parse(x)}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function day(){let k=today();if(!data.days[k])data.days[k]={attempts:[],complete:false};return data.days[k]}
function total(d){return d.attempts.reduce((a,b)=>a+b,0)}
function average(d){return d.attempts.length?total(d)/d.attempts.length:0}
function record(){let n=Math.floor(Number($("count").value));if(!Number.isFinite(n)||n<1){$("count").focus();return}
let d=day();if(d.complete){alert("오늘 500개를 완료했어요!");return}d.attempts.push(n);if(total(d)>=500)d.complete=true;save();render();$("count").value="";$("count").focus()}
function undo(){let d=day();if(!d.attempts.length){alert("되돌릴 기록이 없습니다.");return}d.attempts.pop();d.complete=false;save();render()}
function resetAll(){if(confirm("오늘 기록을 초기화할까요?")){delete data.days[today()];save();render()}}
function completed(){return Object.entries(data.days).filter(([k,d])=>d.complete&&d.attempts.length).sort((a,b)=>a[0].localeCompare(b[0]))}
function render(){let d=day(),t=total(d);$("dateText").textContent=today().replaceAll("-",".")+" 기록";$("total").textContent=t;
$("bar").style.width=Math.min(t/500*100,100)+"%";$("avg").textContent=average(d).toFixed(1)+"개";draw();history()}
function history(){let a=completed().slice().reverse();$("history").innerHTML=a.length?a.map(([k,d])=>`<div class="row"><span>${k.replaceAll("-",".")}</span><span class="complete">${average(d).toFixed(1)}개 평균 · ${total(d)}개</span></div>`).join(""):'<div class="empty">500개를 완료한 날의 평균이 여기에 쌓여요.</div>'}
function draw(){let c=$("chart"),ctx=c.getContext("2d"),w=c.clientWidth,h=210,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,w,h);
let p=completed().map(([k,d])=>({k,v:average(d)}));if(!p.length){ctx.fillStyle="#888";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("500개 완료 기록이 생기면 그래프가 나타나요.",w/2,105);return}
let pad={l:42,r:12,t:18,b:34},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(...p.map(x=>x.v),1),min=Math.min(...p.map(x=>x.v),0),range=max-min||1;
ctx.strokeStyle="#ddd";for(let i=0;i<4;i++){let y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}
ctx.fillStyle="#777";ctx.font="11px sans-serif";ctx.textAlign="right";for(let i=0;i<4;i++){let v=max-range*i/3;ctx.fillText(v.toFixed(0),pad.l-7,pad.t+ch*i/3+4)}
let X=i=>p.length==1?pad.l+cw/2:pad.l+cw*i/(p.length-1),Y=v=>pad.t+ch*(max-v)/range;
ctx.strokeStyle="#0A84FF";ctx.lineWidth=3;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(i),Y(q.v)):ctx.moveTo(X(i),Y(q.v)));ctx.stroke();
ctx.fillStyle="#0A84FF";p.forEach((q,i)=>{ctx.beginPath();ctx.arc(X(i),Y(q.v),5,0,Math.PI*2);ctx.fill()});
ctx.fillStyle="#777";ctx.font="10px sans-serif";ctx.textAlign="center";let start=Math.max(0,p.length-6);for(let i=start;i<p.length;i++)ctx.fillText(p[i].k.slice(5).replace("-","."),X(i),195)}
load();render();window.addEventListener("resize",draw);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
